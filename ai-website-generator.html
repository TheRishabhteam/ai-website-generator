<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Website Generator — Rishabh</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0A1628; color: #fff; min-height: 100vh; }

/* Header */
.header { background: linear-gradient(135deg, #0A1628, #1A3A5C); padding: 20px; text-align: center; border-bottom: 2px solid #C9A84C44; }
.header h1 { font-size: 22px; font-weight: 900; color: #fff; }
.header h1 span { color: #C9A84C; }
.header p { font-size: 12px; color: #7EB8F7; margin-top: 4px; }

/* Form */
.form-wrap { padding: 20px; max-width: 600px; margin: 0 auto; }

.quick-paste { background: #1A2A1A; border: 1px solid #C9A84C66; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
.quick-paste label { font-size: 12px; font-weight: 700; color: #C9A84C; display: block; margin-bottom: 8px; }
.quick-paste textarea { width: 100%; background: #0A0A0A; color: #E8D5A3; border: 1px solid #333; border-radius: 8px; padding: 10px; font-size: 12px; font-family: monospace; resize: vertical; min-height: 80px; }
.btn-parse { width: 100%; background: #C9A84C; color: #1A1A1A; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 700; margin-top: 10px; cursor: pointer; }

.divider { text-align: center; color: #444; font-size: 12px; margin: 16px 0; }

.field-group { margin-bottom: 14px; }
.field-group label { font-size: 12px; font-weight: 600; color: #7EB8F7; display: block; margin-bottom: 5px; }
.field-group input, .field-group select, .field-group textarea {
    width: 100%; background: #0D1F35; color: #fff; border: 1px solid #1A3A5C;
    border-radius: 8px; padding: 12px; font-size: 14px; outline: none;
    transition: border-color 0.2s;
}
.field-group input:focus, .field-group select:focus, .field-group textarea:focus { border-color: #0A66C2; }
.field-group select option { background: #0D1F35; }

/* Color grid */
.color-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
.color-opt { border: 2px solid transparent; border-radius: 8px; padding: 8px 4px; cursor: pointer; text-align: center; font-size: 10px; font-weight: 700; transition: all 0.2s; }
.color-opt.selected { border-color: #fff; box-shadow: 0 0 0 2px #0A66C2; }

/* Generate button */
.btn-generate { width: 100%; background: linear-gradient(135deg, #0A66C2, #1D9E75); color: #fff; border: none; padding: 18px; border-radius: 12px; font-size: 17px; font-weight: 800; cursor: pointer; margin-top: 10px; letter-spacing: 0.5px; box-shadow: 0 8px 24px rgba(10,102,194,0.4); transition: all 0.3s; }
.btn-generate:active { transform: scale(0.98); }
.btn-generate:disabled { background: #333; box-shadow: none; cursor: not-allowed; }

/* Status */
.status { display: none; background: #0D1F35; border-radius: 12px; padding: 20px; margin-top: 16px; text-align: center; }
.status.show { display: block; }
.spinner { width: 40px; height: 40px; border: 3px solid #1A3A5C; border-top-color: #0A66C2; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.status-text { font-size: 14px; color: #7EB8F7; }

/* Log */
.log { background: #050D1A; border-radius: 8px; padding: 12px; margin-top: 12px; max-height: 150px; overflow-y: auto; }
.log-line { font-size: 11px; font-family: monospace; padding: 2px 0; }
.log-info { color: #7EB8F7; }
.log-ok { color: #6ddf6d; }
.log-err { color: #ff6b6b; }

/* Result */
.result { display: none; background: #0D1F35; border-radius: 12px; padding: 20px; margin-top: 16px; }
.result.show { display: block; }
.result h3 { color: #1D9E75; font-size: 16px; margin-bottom: 14px; }
.page-card { background: #1A2A3A; border-radius: 10px; padding: 14px; margin-bottom: 10px; border-left: 3px solid #0A66C2; }
.page-card strong { display: block; font-size: 14px; margin-bottom: 4px; }
.page-card small { color: #7EB8F7; font-size: 11px; display: block; margin-bottom: 10px; }
.page-btns { display: flex; gap: 8px; }
.btn-sm { flex: 1; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 700; text-align: center; text-decoration: none; border: none; cursor: pointer; display: block; }
.btn-edit { background: #0A66C2; color: #fff; }
.btn-view { background: #1D9E75; color: #fff; }
.btn-share { background: #25D366; color: #fff; margin-top: 8px; width: 100%; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 700; border: none; cursor: pointer; }

/* Settings link */
.settings-note { text-align: center; font-size: 11px; color: #555; margin-top: 20px; padding-bottom: 30px; }
.settings-note a { color: #7EB8F7; }

/* API key form */
.api-setup { background: #1A1A2E; border: 1px solid #C9A84C44; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
.api-setup h3 { font-size: 14px; color: #C9A84C; margin-bottom: 12px; }
</style>
</head>
<body>

<script>
// ── Keys management ────────────────────────────────────────────────────────
function saveKeys() {
    var ak = document.getElementById('api-key').value.trim();
    var uk = document.getElementById('uns-key').value.trim();
    if(!ak) { alert('Groq API key daalo!'); return; }
    localStorage.setItem('eab_groq_key', ak);
    if(uk) localStorage.setItem('eab_uns_key', uk);
    document.getElementById('api-setup').style.display = 'none';
    alert('✅ Keys saved! Ab generate kar sakte ho.');
}

window.addEventListener('load', function() {
    var ak = localStorage.getItem('eab_groq_key');
    if(ak) {
        document.getElementById('api-setup').style.display = 'none';
        document.getElementById('api-key').value = ak;
    }
    var uk = localStorage.getItem('eab_uns_key');
    if(uk) document.getElementById('uns-key').value = uk;
});

// ── Color select ───────────────────────────────────────────────────────────
function selColor(el) {
    document.querySelectorAll('.color-opt').forEach(e => e.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('ct').value = el.dataset.v;
}

// ── Auto fill ──────────────────────────────────────────────────────────────
function autofill() {
    var raw = document.getElementById('quick-paste').value.trim();
    if(!raw) { alert('Pehle paste karo!'); return; }
    function ex(keys, t) {
        for(var k of keys) { var m = t.match(new RegExp(k+'[:\\-]?\\s*(.+)','im')); if(m) return m[1].trim(); }
        return '';
    }
    var bn  = ex(['Business','Name','Clinic','Restaurant','Hotel','Shop'], raw);
    var loc = ex(['Location','Address','City','Area','Place'], raw);
    var ph  = ex(['Phone','Mobile','WhatsApp','Contact','Number'], raw);
    var svc = ex(['Services','Service','Products','Offers','Speciality'], raw);
    var ext = ex(['About','Extra','Info','Experience','Note'], raw);
    var low = raw.toLowerCase();
    var btMap = {'dental':'dental clinic','salon':'salon and beauty parlour','restaurant':'restaurant and cafe','hotel':'hotel and resort','gym':'gym and fitness center','clinic':'hospital or clinic','real estate':'luxury real estate agency','interior':'interior design studio','coaching':'education and coaching institute','spa':'medical spa and aesthetic clinic','law':'law firm','construction':'construction and architecture firm','travel':'travel agency','fashion':'fashion boutique','digital marketing':'digital marketing agency','ecommerce':'ecommerce store','photography':'photography studio','ca ':'CA and accounting firm'};
    var btSel = document.getElementById('bt');
    for(var k in btMap) { if(low.includes(k)) { for(var o of btSel.options) { if(o.value===btMap[k]){btSel.value=btMap[k];break;} } break; } }
    if(bn)  document.getElementById('bn').value  = bn;
    if(loc) document.getElementById('loc').value = loc;
    if(ph)  document.getElementById('wa').value  = ph;
    if(svc) document.getElementById('svc').value = svc;
    if(ext) document.getElementById('ext').value = ext;
    var btn = document.querySelector('.btn-parse');
    btn.textContent = '✅ Done! Review and Generate!';
    btn.style.background = '#1D9E75';
    btn.style.color = '#fff';
}

// ── Color themes ───────────────────────────────────────────────────────────
var themes = {
    blue_white:   {p:'#0A66C2',s:'#1A3A5C',a:'#FF6B35',bg:'#0A1628',sbg:'#F0F6FF',td:'#1A1A2E',tm:'#666'},
    dark_gold:    {p:'#C9A84C',s:'#1A1A1A',a:'#E8C97A',bg:'#0D0D0D',sbg:'#F5F0E8',td:'#1A1A1A',tm:'#888'},
    green_white:  {p:'#1D9E75',s:'#0F6E56',a:'#4CAF50',bg:'#0B3D2E',sbg:'#F0FBF6',td:'#1A2E25',tm:'#555'},
    purple_white: {p:'#6C3FC5',s:'#4A1E8C',a:'#9B59B6',bg:'#1A0A2E',sbg:'#F5F0FF',td:'#1A0A2E',tm:'#666'},
    red_white:    {p:'#E53935',s:'#B71C1C',a:'#FF6B6B',bg:'#1A0505',sbg:'#FFF5F5',td:'#1A0505',tm:'#666'},
    teal_white:   {p:'#00897B',s:'#00695C',a:'#26C6DA',bg:'#003D36',sbg:'#E0F7FA',td:'#003D36',tm:'#555'},
    orange_dark:  {p:'#FF6F00',s:'#E65100',a:'#FFD600',bg:'#1A0A00',sbg:'#FFF8F0',td:'#1A0A00',tm:'#666'},
    rose_gold:    {p:'#C2185B',s:'#880E4F',a:'#FFA000',bg:'#1A0010',sbg:'#FCE4EC',td:'#1A0010',tm:'#666'},
};

// ── Industry blueprints (simplified for web app) ───────────────────────────
var blueprints = {
    'dental clinic':               {hero:'hero_medical',  secs:['stats_bar','treatment_showcase','doctor_profile','before_after','appointment_cta','testimonials_cards','faq_accordion','cta_banner']},
    'medical spa':                 {hero:'hero_elegant',  secs:['stats_bar','service_showcase','before_after','treatment_showcase','why_us_dark','testimonials_cards','pricing_cards','appointment_cta']},
    'wellness':                    {hero:'hero_minimal',  secs:['stats_bar','services_grid','about_split','process_steps','team_grid','testimonials_cards','pricing_cards','cta_banner']},
    'real estate':                 {hero:'hero_property', secs:['stats_bar','property_listings','about_split','process_steps','team_grid','testimonials_cards','awards_logos','contact_split']},
    'restaurant':                  {hero:'hero_cinematic',secs:['stats_bar','menu_section','masonry_showcase','about_split','why_us_dark','testimonials_cards','cta_banner']},
    'law firm':                    {hero:'hero_dark_pro', secs:['stats_bar','services_list','about_split','team_grid','why_us_dark','awards_logos','testimonials_cards','faq_accordion','cta_banner']},
    'gym':                         {hero:'hero_energy',   secs:['stats_bar','class_schedule','pricing_cards','about_split','team_grid','testimonials_cards','cta_banner']},
    'education':                   {hero:'hero_split',    secs:['stats_bar','services_grid','about_split','team_grid','pricing_cards','testimonials_cards','faq_accordion','cta_banner']},
    'ecommerce':                   {hero:'hero_ecommerce',secs:['category_strip','deals_section','product_showcase','brands_strip','why_us_dark','testimonials_cards','cta_banner']},
    'interior design':             {hero:'hero_portfolio',secs:['stats_bar','masonry_showcase','project_showcase','about_split','team_grid','testimonials_cards','cta_banner']},
    'photography':                 {hero:'hero_portfolio',secs:['masonry_showcase','services_list','about_split','pricing_cards','testimonials_cards','cta_banner']},
    'travel':                      {hero:'hero_travel',   secs:['stats_bar','tour_packages','category_strip','about_split','masonry_showcase','testimonials_cards','cta_banner']},
    'hospital':                    {hero:'hero_medical',  secs:['stats_bar','services_grid','doctor_profile','appointment_cta','treatment_showcase','testimonials_cards','faq_accordion','cta_banner']},
    'CA and accounting':           {hero:'hero_dark_pro', secs:['stats_bar','services_list','about_split','team_grid','why_us_dark','awards_logos','testimonials_cards','cta_banner']},
    'news':                        {hero:'hero_magazine', secs:['news_magazine','category_strip','blog_grid','about_split','cta_banner']},
    'fashion':                     {hero:'hero_elegant',  secs:['category_strip','product_showcase','masonry_showcase','about_split','brands_strip','testimonials_cards','cta_banner']},
    'digital marketing':           {hero:'hero_tech',     secs:['brands_strip','services_grid','about_split','process_steps','why_us_dark','pricing_cards','testimonials_cards','cta_banner']},
    'hotel':                       {hero:'hero_luxury_slider',secs:['room_showcase','stats_bar','masonry_showcase','about_split','why_us_dark','awards_logos','contact_split']},
    'salon':                       {hero:'hero_beauty',   secs:['stats_bar','service_showcase','before_after','team_grid','pricing_cards','testimonials_cards','appointment_cta']},
    'construction':                {hero:'hero_bold_dark',secs:['stats_bar','project_showcase','masonry_showcase','about_split','why_us_dark','awards_logos','testimonials_cards','cta_banner']},
};

function getBlueprintSecs(bt) {
    for(var k in blueprints) { if(bt.toLowerCase().includes(k)) return blueprints[k].secs; }
    return ['stats_bar','services_grid','about_split','process_steps','why_us_dark','testimonials_cards','cta_banner'];
}

function getHero(bt) {
    for(var k in blueprints) { if(bt.toLowerCase().includes(k)) return blueprints[k].hero; }
    return 'hero_fullscreen';
}

// ── Unsplash image fetch ───────────────────────────────────────────────────
async function fetchImg(q, key) {
    if(!key) return '';
    try {
        var r = await fetch('https://api.unsplash.com/photos/random?query='+encodeURIComponent(q)+'&orientation=landscape&client_id='+key);
        var d = await r.json();
        return d.urls?.regular || '';
    } catch(e) { return ''; }
}

// ── Log helper ─────────────────────────────────────────────────────────────
function log(msg, t) {
    var el = document.getElementById('log');
    el.innerHTML += '<div class="log-line log-'+(t||'info')+'">▸ '+msg+'</div>';
    el.scrollTop = el.scrollHeight;
}

// ── Color helpers ──────────────────────────────────────────────────────────
function bg(type, c, img) {
    var styles = {
        white:            'background:#FFFFFF',
        light:            'background:'+c.sbg,
        primary_gradient: 'background:linear-gradient(135deg,'+c.p+','+c.s+')',
        dark_gradient:    'background:linear-gradient(135deg,'+c.s+','+c.bg+')',
        img_overlay:      img ? 'background:url('+img+') center/cover no-repeat;position:relative' : 'background:linear-gradient(135deg,'+c.p+','+c.s+')',
    };
    return styles[type] || 'background:#fff';
}

function badge(txt, color) { return '<span style="background:'+color+'22;color:'+color+';font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:5px 14px;border-radius:20px;display:inline-block;margin-bottom:12px;">'+txt+'</span>'; }
function btn(txt, url, color) { return '<a href="'+(url||'#')+'" style="display:inline-block;padding:13px 30px;border-radius:50px;font-size:14px;font-weight:800;text-decoration:none;background:'+color+';color:#fff;transition:all 0.3s;margin:4px;">'+txt+'</a>'; }
function btnOutline(txt, url) { return '<a href="'+(url||'#')+'" style="display:inline-block;padding:13px 30px;border-radius:50px;font-size:14px;font-weight:800;text-decoration:none;background:transparent;border:2px solid rgba(255,255,255,0.6);color:#fff;margin:4px;">'+txt+'</a>'; }

// ── Section renderers ──────────────────────────────────────────────────────
function renderSection(sec, c, imgs, bn, wa) {
    var t = sec.type; var i0 = imgs[sec.bg_img_index||0]||''; var img = i0;
    var waLink = wa ? 'https://wa.me/'+wa.replace(/[^0-9]/g,'') : '#contact';

    switch(t) {
        case 'hero_medical': return renderHeroMedical(sec,c,img,wa);
        case 'hero_property': return renderHeroProperty(sec,c,img);
        case 'hero_cinematic': return renderHeroCinematic(sec,c,img);
        case 'hero_energy': return renderHeroEnergy(sec,c,img);
        case 'hero_portfolio': return renderHeroPortfolio(sec,c,img);
        case 'hero_travel': return renderHeroTravel(sec,c,img);
        case 'hero_luxury_slider': return renderHeroLuxury(sec,c,img);
        case 'hero_dark_pro': return renderHeroDarkPro(sec,c,img);
        case 'hero_ecommerce': return renderHeroEcommerce(sec,c,img);
        case 'hero_beauty': return renderHeroBeauty(sec,c,img);
        case 'hero_magazine': return renderHeroMagazine(sec,c,img);
        case 'hero_tech': return renderHeroTech(sec,c);
        case 'hero_bold_dark': return renderHeroBold(sec,c,img);
        case 'hero_elegant': return renderHeroElegant(sec,c,img);
        case 'hero_split': return renderHeroSplit(sec,c,img);
        case 'hero_fullscreen': return renderHeroFull(sec,c,img);
        case 'hero_minimal': return renderHeroMinimal(sec,c,img);
        case 'stats_bar': return renderStats(sec,c);
        case 'services_grid': return renderServicesGrid(sec,c);
        case 'services_list': return renderServicesList(sec,c);
        case 'about_split': return renderAbout(sec,c,img);
        case 'process_steps': return renderProcess(sec,c);
        case 'why_us_dark': return renderWhyUs(sec,c);
        case 'testimonials_cards': return renderTestimonials(sec,c);
        case 'team_grid': return renderTeam(sec,c);
        case 'faq_accordion': return renderFaq(sec,c);
        case 'cta_banner': return renderCta(sec,c,img,wa);
        case 'appointment_cta': return renderAppointment(sec,c,wa);

// ── Main generate function ─────────────────────────────────────────────────
async function generate() {
    var bt  = document.getElementById('bt').value;
    var bn  = document.getElementById('bn').value.trim();
    var loc = document.getElementById('loc').value.trim();
    var svc = document.getElementById('svc').value.trim();
    var wa  = document.getElementById('wa').value.trim();
    var ext = document.getElementById('ext').value.trim();
    var ct  = document.getElementById('ct').value;
    var ak  = localStorage.getItem('eab_groq_key') || document.getElementById('api-key').value.trim();
    var uk  = localStorage.getItem('eab_uns_key')  || document.getElementById('uns-key').value.trim();

    if(!bt || !bn) { alert('Industry aur Business Name zaroori hai!'); return; }
    if(!ak)        { alert('Pehle Groq API key save karo!'); return; }

    var c = themes[ct] || themes.blue_white;
    var secs = getBlueprintSecs(bt);
    var hero = getHero(bt);

    document.getElementById('gen-btn').disabled = true;
    document.getElementById('status').classList.add('show');
    document.getElementById('result').classList.remove('show');
    document.getElementById('log').innerHTML = '';

    log('🧠 AI analyzing: '+bt+'...');
    log('🎨 Hero style: '+hero);
    log('📋 Section blueprint loaded: '+secs.length+' sections');
    if(uk) log('🖼️ Fetching Unsplash images...');

    // Fetch images
    var imgKeywords = [bt+' '+bn+' professional', bt+' interior modern', bt+' team professional', bt+' service quality', bt+' results success'];
    var imgs = [];
    if(uk) {
        document.getElementById('stxt').textContent = 'Fetching real images...';
        for(var kw of imgKeywords) {
            imgs.push(await fetchImg(kw, uk));
        }
        log('✅ Images ready: '+imgs.filter(Boolean).length+' fetched', 'ok');
    }

    // Build AI prompt
    document.getElementById('stxt').textContent = 'AI generating content...';
    var secList = [hero, ...secs].join(', ');
    var prompt = 'You are a web designer. Generate content for "'+bn+'" ('+bt+(loc?' in '+loc:'')+').'+(svc?' Services: '+svc:'')+(ext?' Extra: '+ext:'')+'\n\nOutput ONLY a JSON object. No markdown. No backticks.\n\nSections to fill (in order): '+secList+'\n\nFor each section, write real specific content for this business.\n\nJSON format:\n{"hero":{"type":"'+hero+'","heading":"H","subheading":"S","cta1_text":"CTA","cta1_url":"#contact","cta2_text":"C2","cta2_url":"#services","trust_badge":"T","phone":"'+(wa||'+91 98765 43210')+'","stats":[{"num":"X+","label":"L"}],"features":["F1","F2","F3"]},"sections":[{"type":"SECTION_TYPE","heading":"H","subheading":"S","bg":"white","items":[...]}]}\n\nRules:\n1. heading must speak to visitor pain/desire\n2. All content must be SPECIFIC to '+bt+'\n3. Include real prices, services, team names\n4. For stats: use realistic numbers\n5. bg alternates: white, light, primary_gradient, dark_gradient\n6. Output ONLY JSON object starting with {';

    try {
        log('🤖 Calling Groq AI...');
        var resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {'Content-Type':'application/json','Authorization':'Bearer '+ak},
            body: JSON.stringify({model:'qwen/qwen3.8-27b',messages:[{role:'system',content:'Output only valid JSON. No markdown, no backticks, no explanation.'},{role:'user',content:prompt}],temperature:0.7,max_tokens:4000})
        });
        var data = await resp.json();
        if(data.error) throw new Error(data.error.message);
        var raw = data.choices[0].message.content;
        log('✅ AI responded ('+raw.length+' chars)', 'ok');

        // Parse
        raw = raw.replace(/^```json?\s*/im,'').replace(/\s*```\s*$/im,'').trim();
        var s = raw.indexOf('{'), e = raw.lastIndexOf('}');
        if(s!==-1 && e>s) raw = raw.substring(s,e+1);
        var parsed = JSON.parse(raw);
        log('✅ JSON parsed successfully', 'ok');

        // Build page HTML
        document.getElementById('stxt').textContent = 'Building website...';
        var sections_html = '';
        var wa_clean = wa.replace(/[^0-9+]/g,'');

        // Hero
        var heroData = parsed.hero || {};
        heroData.bg_img_index = 0;
        sections_html += renderSection({...heroData, type: hero}, c, imgs, bn, wa_clean);
        log('✅ Hero rendered: '+hero, 'ok');

        // Content sections
        var aiSecs = parsed.sections || [];
        for(var i=0; i<secs.length; i++) {
            var secType = secs[i];
            var secData = aiSecs.find(s=>s.type===secType) || {type:secType};
            secData.bg_img_index = i+1;
            sections_html += renderSection(secData, c, imgs, bn, wa_clean);
            log('✅ Section: '+secType, 'ok');
        }

        // WhatsApp button
        var waBtn = wa_clean ? '<a href="https://wa.me/'+wa_clean.replace('+','')+'" style="position:fixed;bottom:24px;right:24px;z-index:9999;width:58px;height:58px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(37,211,102,0.5);text-decoration:none;" target="_blank"><svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg></a>' : '';

        // Full page
        var fullPage = '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>'+bn+(loc?' - '+loc:'')+'</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></s'+'cript><style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}img{max-width:100%;height:auto;}@media(max-width:600px){section{padding-left:20px!important;padding-right:20px!important;}.grid-cols-3{grid-template-columns:1fr!important;}.hero-split-right{display:none!important;}h1{font-size:clamp(24px,7vw,36px)!important;}}</style></head><body>'+sections_html+waBtn+'<script>document.addEventListener("DOMContentLoaded",function(){AOS.init({duration:700,once:true,offset:60});});<\/script></body></html>';

        // Blob URL for preview
        var blob = new Blob([fullPage], {type:'text/html'});
        var url = URL.createObjectURL(blob);

        document.getElementById('status').classList.remove('show');
        document.getElementById('gen-btn').disabled = false;

        // Show result
        var resultEl = document.getElementById('result');
        resultEl.classList.add('show');
        resultEl.innerHTML = '<h3>✅ Website Ready!</h3><div class="page-card"><strong>📄 '+bn+' — Home Page</strong><small>'+secs.length+1+' sections | '+hero.replace('hero_','').replace('_',' ')+' hero | '+ct.replace('_',' ')+' theme</small><div class="page-btns"><a href="'+url+'" target="_blank" class="btn-sm btn-view">👁️ Preview</a><button onclick="downloadPage(\''+encodeURIComponent(fullPage)+'\',\''+bn.replace(/\s+/g,'-').toLowerCase()+'.html\')" class="btn-sm btn-edit">⬇️ Download</button></div><button onclick="shareWhatsApp(\''+url+'\',\''+bn+'\')" class="btn-share">💬 Share on WhatsApp</button></div>';

        // Store page for sharing
        window._lastPage = fullPage;
        window._lastPageName = bn;
        log('🎉 Website ready!', 'ok');

    } catch(err) {
        document.getElementById('status').classList.remove('show');
        document.getElementById('gen-btn').disabled = false;
        log('❌ Error: '+err.message, 'err');
        document.getElementById('result').classList.add('show');
        document.getElementById('result').innerHTML = '<div style="background:#1A0505;border:1px solid #ff6b6b;border-radius:10px;padding:16px;"><p style="color:#ff6b6b;font-size:14px;margin:0;">❌ '+err.message+'</p><p style="color:#888;font-size:12px;margin:8px 0 0;">Check API key ya dobara try karo.</p></div>';
    }
}

function downloadPage(encoded, filename) {
    var html = decodeURIComponent(encoded);
    var blob = new Blob([html], {type:'text/html'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
}

function shareWhatsApp(url, name) {
    var msg = 'Hi! Maine aapke liye ek demo website banayi hai — '+name+'\n\nDekhne ke liye click karein: '+url+'\n\nPoori website ₹8,000 mein mil sakti hai!\n\n— Rishabh, WordPress Developer\n+91 88514 71308';
    window.open('https://wa.me/?text='+encodeURIComponent(msg), '_blank');
}
